name: Update README stats

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"   # har 6 ghante (doosre repos ke commits bhi pakad ne ke liye)
  workflow_dispatch:         # Actions tab se manually "Run workflow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update stats in README
        env:
          # STATS_TOKEN (PAT) optional hai; na ho to default token chalega
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/update_stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update stats [skip ci]"
          git push
